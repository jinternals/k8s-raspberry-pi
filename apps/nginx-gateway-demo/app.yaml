# NGINX Gateway Fabric demo – see nginx.md
# Uses letsencrypt-staging; switch to letsencrypt-prod once HTTPS works.
# Replace homelabs.co.in with your own domain.
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-demo
---
apiVersion: v1
kind: Service
metadata:
  name: demo-svc
  namespace: nginx-demo
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  namespace: nginx-demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v1
    spec:
      containers:
        - name: demo-app
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: k8s-gateway
  namespace: nginx-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: nginx
  listeners:
    - name: http-listener
      hostname: "*.homelabs.co.in"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-listener
      hostname: "secure.homelabs.co.in"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: secure-homelabs-cert
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insecure-http-route
  namespace: nginx-demo
spec:
  parentRefs:
    - kind: Gateway
      name: k8s-gateway
      sectionName: http-listener
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: HTTPRoute
                value: insecure-http-route
      backendRefs:
        - name: demo-svc
          port: 80
---
# Redirect plain HTTP for the secure host to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure-https-redirect
  namespace: nginx-demo
spec:
  parentRefs:
    - kind: Gateway
      name: k8s-gateway
      sectionName: http-listener
  hostnames:
    - secure.homelabs.co.in
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure-http-route
  namespace: nginx-demo
spec:
  parentRefs:
    - kind: Gateway
      name: k8s-gateway
      sectionName: https-listener
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: HTTPRoute
                value: secure-http-route
      backendRefs:
        - name: demo-svc
          port: 80
