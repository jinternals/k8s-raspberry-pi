# Longhorn UI on the LAN-only internal Gateway (apps/internal-gateway/gateway.yaml), listener "longhorn".
#   From the cluster LAN: http://192.168.0.201:8081
#   From another local network: port-forward 8081 -> 192.168.0.201:8081 on the router in front of the cluster
#
# The Longhorn UI has no login: anyone who can reach it can delete volumes.
# Keep it local only and never expose port 8081 to the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: internal-gateway
      sectionName: longhorn
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
